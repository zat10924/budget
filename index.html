<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تدبير مصروف البيت</title>
<style>:root{color-scheme:light}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: دفتر حسابات البيت. شريط المدة في الأعلى، تبويبات ثابتة، ثم بطاقات متراصة بعمود واحد؛ الأقسام شبكة من عمودين. */
:root{
  --bg:#EDF1EF; --surface:#FAFCFB; --surface-2:#E1E9E6; --ink:#12302A; --ink-2:#4E645D; --line:#CBD6D2;
  --accent:#0E6B5B; --accent-ink:#FFFFFF; --accent-soft:#D2E8E2;
  --good:#2A7548; --good-bg:#D9EEE1; --warn:#8F5C00; --warn-bg:#F6E8C6; --bad:#B0322A; --bad-bg:#F5D9D5;
  --c1:#2B6CB0; --c2:#C2571A; --c3:#4F8A1E; --c4:#A9780A; --c5:#7B4FA3; --c6:#16808B; --c7:#B03A5B; --c8:#5E6E74;
  --font-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
  --font-display:'Readex Pro','IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1614; --surface:#16211E; --surface-2:#22312D; --ink:#E4EFEB; --ink-2:#9CB1AA; --line:#2B3C37;
    --accent:#3FB8A0; --accent-ink:#062520; --accent-soft:#183A34;
    --good:#66C792; --good-bg:#17352A; --warn:#E5AE45; --warn-bg:#3A2E12; --bad:#F08479; --bad-bg:#40201D;
    --c1:#6AA8E8; --c2:#F08A4B; --c3:#8CC152; --c4:#E3B341; --c5:#B58BDC; --c6:#4FC3CF; --c7:#E5728F; --c8:#9AAAB0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1614; --surface:#16211E; --surface-2:#22312D; --ink:#E4EFEB; --ink-2:#9CB1AA; --line:#2B3C37;
  --accent:#3FB8A0; --accent-ink:#062520; --accent-soft:#183A34;
  --good:#66C792; --good-bg:#17352A; --warn:#E5AE45; --warn-bg:#3A2E12; --bad:#F08479; --bad-bg:#40201D;
  --c1:#6AA8E8; --c2:#F08A4B; --c3:#8CC152; --c4:#E3B341; --c5:#B58BDC; --c6:#4FC3CF; --c7:#E5728F; --c8:#9AAAB0;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  font-family:var(--font-body); background:var(--bg); color:var(--ink); line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 120px; -webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:760px;margin-inline:auto}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.cur{font-size:.8em;color:var(--ink-2)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 8px}
.top h1{font:700 22px/1.2 var(--font-display)}
.top small{display:block;color:var(--ink-2);font-size:13px;margin-top:2px}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.icon-btn.plain{border-color:transparent;background:transparent;color:var(--ink-2)}
.notice{margin-block:8px;padding:10px 14px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-size:14px}
.tabs{display:flex;gap:4px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-height:44px;padding:8px 12px;border-radius:10px;border:0;background:transparent;color:var(--ink-2);font:600 14px var(--font-body);white-space:nowrap}
.tab[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
#view{display:flex;flex-direction:column;gap:16px;padding-block:16px}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.sec{font:600 16px var(--font-display)}
.sec-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:8px 0;min-height:44px}
.btn{min-height:46px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.btn.sm{min-height:44px;padding:6px 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:default}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}
.pill{font:600 11px/1 var(--font-body);padding:5px 9px;border-radius:999px;white-space:nowrap;font-style:normal}
.pill.ok,.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.empty{padding:24px 16px;text-align:center;color:var(--ink-2);border:1px dashed var(--line);border-radius:16px;display:flex;flex-direction:column;gap:6px}

/* hero */
.hero{display:flex;flex-direction:column;gap:14px}
.hero-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--ink-2);font-size:14px}
.hero-top b{color:var(--ink);font-weight:600}
.big{font:700 44px/1.05 var(--font-display)}
.big-lbl{color:var(--ink-2);font-size:14px;margin-top:4px}
.meter{position:relative;height:14px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.meter .fill{position:absolute;inset-block:0;inset-inline-start:0;background:var(--accent);border-radius:999px}
.meter .fill.hot{background:var(--bad)}
.tick{position:absolute;inset-block:0;width:3px;background:var(--ink);opacity:.75}
.legend{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-2)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:10px 12px;min-width:0}
.stat b{display:block;font:600 18px var(--font-display)}
.stat span{font-size:12px;color:var(--ink-2)}

/* alerts */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.alert.bad{background:var(--bad-bg);border-color:transparent}
.alert.warn{background:var(--warn-bg);border-color:transparent}
.alert.good{background:var(--good-bg);border-color:transparent}
.alert b{display:block;font-weight:600}
.alert p{font-size:14px;color:var(--ink-2)}
.alert.bad p,.alert.warn p,.alert.good p{color:var(--ink)}

/* categories */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.cat{display:flex;flex-direction:column;gap:6px;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.cat-h{display:flex;align-items:center;gap:8px;min-width:0}
.cat-h b{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.cat-n{font:700 22px/1.1 var(--font-display)}
.cat-s,.cat-f{font-size:13px;color:var(--ink-2)}
.bar{position:relative;height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar u{position:absolute;inset-block:0;inset-inline-start:0;border-radius:999px;text-decoration:none}
.bar .tick{width:2px}
.cat.bad{border-color:var(--bad)}

/* expense rows */
.list{padding:4px 16px}
.exp{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.exp:last-child{border-bottom:0}
.exp-m{flex:1;min-width:0;display:flex;flex-direction:column}
.exp-m b{font-weight:600;overflow-wrap:anywhere}
.exp-m span{font-size:13px;color:var(--ink-2)}
.exp-a{font-weight:600;white-space:nowrap}
.day{font:600 13px var(--font-body);color:var(--ink-2);padding-top:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"],.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* settings */
.srow{display:grid;grid-template-columns:14px minmax(0,1fr) 44px;gap:8px 10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.srow:last-of-type{border-bottom:0}
.srow .sub{grid-column:2/3;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.in{width:100%;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 16px var(--font-body)}
.in.pct{width:90px;direction:ltr;text-align:center}
.in.amt{width:110px;direction:ltr;text-align:center}
.pctbox{display:flex;align-items:center;gap:6px}
.sumline{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;padding-top:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:14px}
details{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:4px 16px}
summary{min-height:44px;display:flex;align-items:center;font-weight:600;cursor:pointer}
details p,details li{font-size:14px;color:var(--ink-2)}
details ul{padding-inline-start:20px;margin:0 0 12px;display:flex;flex-direction:column;gap:4px}

/* dialogs */
.scrim{position:fixed;inset:0;background:rgba(6,18,15,.55);z-index:40}
.dlg{position:fixed;left:0;right:0;bottom:0;margin-inline:auto;width:min(100%,560px);max-height:92dvh;overflow:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));z-index:41;display:flex;flex-direction:column;gap:14px}
.scrim.hi{z-index:50}.dlg.hi{z-index:51}
.dlg h2{font:600 18px var(--font-display)}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.amt-row{display:flex;gap:8px}
.amt-row .in{font:700 24px var(--font-display);direction:ltr;text-align:start}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label{cursor:pointer}
.chips input:focus-visible + .chip{outline:3px solid var(--accent);outline-offset:2px}
.chips input:checked + .chip{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.calc-disp{direction:ltr;text-align:right;background:var(--bg);border-radius:14px;padding:12px 16px;min-height:84px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;overflow:hidden}
.calc-disp .ex{font:500 22px var(--font-display);color:var(--ink-2);overflow-wrap:anywhere;min-height:30px}
.calc-disp .rs{font:700 34px var(--font-display);min-height:42px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;direction:ltr}
.key{min-height:56px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font:600 22px var(--font-display)}
.key.op{background:var(--accent-soft);color:var(--accent)}
.key.eq{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fab{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;min-height:54px;padding:0 20px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font:600 16px var(--font-body);display:inline-flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:60;max-width:min(92vw,520px);padding:12px 18px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:500;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#toast.bad{background:var(--bad);color:#fff}
#toast.warn{background:var(--warn);color:#fff}

/* paper report (always light, like a printed sheet) */
.paper{background:#fff;color:#14231f;border:1px solid var(--line);border-radius:14px;padding:18px;line-height:1.55;font-family:var(--font-body);min-width:0}
.paper h2{font:700 22px var(--font-display);margin:0}
.paper h3{font:600 15px var(--font-display);margin:0 0 8px}
.p-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:14px;border-bottom:2px solid #14231f;margin-bottom:14px}
.p-head p{color:#5b6e68;font-size:14px}
.p-badge{font:600 12px var(--font-body);padding:5px 10px;border-radius:999px;background:#d9eee1;color:#1f6a3d;white-space:nowrap}
.p-badge.open{background:#f6e8c6;color:#7a5000}
.p-sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px}
.p-sum div{border:1px solid #d6dedb;border-radius:10px;padding:10px 12px}
.p-sum span{display:block;font-size:12px;color:#5b6e68}
.p-sum b{font:700 19px var(--font-display)}
.p-wrap{overflow-x:auto}
.p-table{width:100%;border-collapse:collapse;font-size:13px}
.p-table th{text-align:start;font-weight:600;color:#5b6e68;padding:6px;border-bottom:1px solid #14231f;white-space:nowrap}
.p-table td{padding:9px 6px;border-bottom:1px solid #e3e9e6;vertical-align:top}
.p-table td.pos{color:#25703f;font-weight:600}
.p-table td.neg{color:#b0322a;font-weight:600}
.p-name{display:flex;align-items:center;gap:7px;font-weight:600}
.p-name i{width:9px;height:9px;border-radius:50%;display:inline-block}
.p-bar{height:6px;background:#e5ece9;border-radius:99px;margin-top:5px;overflow:hidden;min-width:70px}
.p-bar u{display:block;height:100%;text-decoration:none}
.p-block{margin-top:16px;padding:12px 14px;border-radius:10px;background:#f1f5f3;font-size:14px}
.p-block p+p{margin-top:4px}
.p-note{margin-top:16px;font-size:12px;color:#5b6e68;border-top:1px solid #d6dedb;padding-top:10px}
.p-plot{position:relative;height:120px;display:flex;gap:3px;align-items:flex-end;border-bottom:1px solid #14231f;margin-top:8px}
.p-plot .col{flex:1;display:flex;align-items:flex-end;justify-content:center;height:100%}
.p-plot .col u{display:block;width:72%;border-radius:3px 3px 0 0;text-decoration:none}
.p-line{position:absolute;left:0;right:0;border-top:2px dashed #14231f;opacity:.55}
.p-days{display:flex;gap:3px}
.p-days span{flex:1;text-align:center;font-size:10px;color:#5b6e68}
.p-leg{font-size:12px;color:#5b6e68;margin-top:6px}
.p-kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}
.p-kv div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #e3e9e6;padding:6px 0;font-size:14px}
.p-kv span{color:#5b6e68}
.paper.pdfw{width:794px;border:0;border-radius:0;padding:44px 48px}
.pdfw .p-sum{grid-template-columns:repeat(4,minmax(0,1fr))}
#pdfStage{position:fixed;top:0;left:-10000px;width:794px;z-index:-1;pointer-events:none}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (min-width:600px){.p-sum{grid-template-columns:repeat(4,minmax(0,1fr))}.stats{gap:12px}}
.login{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;padding:20px}
</style>
</head><body>
<div id="root" dir="rtl" lang="ar">
  <div id="app">
    <header class="top">
      <div>
        <h1>تدبير مصروف البيت</h1>
        <small id="todayLine"></small>
      </div>
      <button class="icon-btn" data-act="calc" aria-label="الآلة الحاسبة" id="calcBtn"></button>
    </header>
    <div id="notice" class="notice" role="status" hidden></div>
    <nav class="tabs" id="tabs" aria-label="أقسام الصفحة"></nav>
    <main id="view"></main>
  </div>
  <button class="fab" id="fab" data-act="add"></button>
  <div id="login" class="login" hidden><form id="loginForm" class="card" style="width:min(100%,380px);display:flex;flex-direction:column;gap:14px"><h2 class="sec" style="font-size:20px">تدبير مصروف البيت</h2><p class="cat-s">سجّلي الدخول للوصول إلى بياناتك.</p><div class="field"><label for="lEmail">البريد الإلكتروني</label><input class="in" id="lEmail" type="email" autocomplete="username" required dir="ltr"></div><div class="field"><label for="lPass">كلمة المرور</label><input class="in" id="lPass" type="password" autocomplete="current-password" required dir="ltr"></div><p id="loginMsg" class="cat-s" style="color:var(--bad)" role="alert"></p><button class="btn primary" type="submit">دخول</button></form></div>
  <div id="dlgRoot"></div>
  <div id="calcRoot"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="pdfStage" aria-hidden="true"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
'use strict';
document.documentElement.dir='rtl'; document.documentElement.lang='ar';

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const round2=n=>Math.round((n||0)*100)/100;
const fmt=n=>{n=round2(n);return Number.isInteger(n)?n.toLocaleString('en-US'):n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});};
const money=n=>'<span class="num">'+fmt(n)+'</span> <span class="cur">ج.م</span>';
const sum=a=>a.reduce((s,x)=>s+(+x.amount||0),0);
function toNum(s){s=String(s==null?'':s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫،]/g,'.').replace(/[^\d.]/g,'');const n=parseFloat(s);return isFinite(n)?n:NaN;}
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const DAYN=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const DAY=864e5, pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const dm=d=>d.getDate()+' '+MONTHS[d.getMonth()];
const fmtDate=s=>{const d=parse(s);return DAYN[d.getDay()]+' '+dm(d);};
const rid=()=>'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* الفترات: من 5 إلى 20، ومن 20 إلى 5 الشهر التالي */
function startOf(date){const y=date.getFullYear(),m=date.getMonth(),d=date.getDate();if(d>=20)return new Date(y,m,20);if(d>=5)return new Date(y,m,5);return new Date(y,m-1,20);}
function endOf(s){const y=s.getFullYear(),m=s.getMonth();return s.getDate()===5?new Date(y,m,20):new Date(y,m+1,5);}
const keyOf=d=>ymd(startOf(d));
const nextKey=k=>ymd(endOf(parse(k)));
const daysIn=k=>{const s=parse(k);return Math.round((endOf(s)-s)/DAY);};
const curKey=()=>keyOf(new Date());
const rangeText=(s,e)=>'من '+dm(s)+' إلى '+dm(e);
