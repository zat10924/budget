/* Layout: دفتر حسابات البيت. شريط المدة في الأعلى، تبويبات ثابتة، ثم بطاقات متراصة بعمود واحد؛ الأقسام شبكة من عمودين. */
:root{
  --bg:#EDF1EF; --surface:#FAFCFB; --surface-2:#E1E9E6; --ink:#12302A; --ink-2:#4E645D; --line:#CBD6D2;
  --accent:#0E6B5B; --accent-ink:#FFFFFF; --accent-soft:#D2E8E2;
  --good:#2A7548; --good-bg:#D9EEE1; --warn:#8F5C00; --warn-bg:#F6E8C6; --bad:#B0322A; --bad-bg:#F5D9D5;
  --c1:#2B6CB0; --c2:#C2571A; --c3:#4F8A1E; --c4:#A9780A; --c5:#7B4FA3; --c6:#16808B; --c7:#B03A5B; --c8:#5E6E74;
  --font-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
  --font-display:'Readex Pro','IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1614; --surface:#16211E; --surface-2:#22312D; --ink:#E4EFEB; --ink-2:#9CB1AA; --line:#2B3C37;
    --accent:#3FB8A0; --accent-ink:#062520; --accent-soft:#183A34;
    --good:#66C792; --good-bg:#17352A; --warn:#E5AE45; --warn-bg:#3A2E12; --bad:#F08479; --bad-bg:#40201D;
    --c1:#6AA8E8; --c2:#F08A4B; --c3:#8CC152; --c4:#E3B341; --c5:#B58BDC; --c6:#4FC3CF; --c7:#E5728F; --c8:#9AAAB0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{

  --accent:#3FB8A0; --accent-ink:#062520; --accent-soft:#183A34;

*{box-sizing:border-box}
body{
  font-family:var(--font-body); background:var(--bg); color:var(--ink); line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 120px; -webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:760px;margin-inline:auto}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.cur{font-size:.8em;color:var(--ink-2)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 8px}

<script>
(function(){
'use strict';
document.documentElement.dir='rtl'; document.documentElement.lang='ar';

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const round2=n=>Math.round((n||0)*100)/100;
const fmt=n=>{n=round2(n);return Number.isInteger(n)?n.toLocaleString('en-US'):n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});};
const money=n=>'<span class="num">'+fmt(n)+'</span> <span class="cur">ج.م</span>';
const sum=a=>a.reduce((s,x)=>s+(+x.amount||0),0);
function toNum(s){s=String(s==null?'':s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫،]/g,'.').replace(/[^\d.]/g,'');const n=parseFloat(s);return isFinite(n)?n:NaN;}
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const DAYN=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const DAY=864e5, pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const dm=d=>d.getDate()+' '+MONTHS[d.getMonth()];
const fmtDate=s=>{const d=parse(s);return DAYN[d.getDay()]+' '+dm(d);};
const rid=()=>'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* الفترات: من 5 إلى 20، ومن 20 إلى 5 الشهر التالي */
function startOf(date){const y=date.getFullYear(),m=date.getMonth(),d=date.getDate();if(d>=20)return new Date(y,m,20);if(d>=5)return new Date(y,m,5);return new Date(y,m-1,20);}
function endOf(s){const y=s.getFullYear(),m=s.getMonth();return s.getDate()===5?new Date(y,m,20):new Date(y,m+1,5);}
const keyOf=d=>ymd(startOf(d));
const nextKey=k=>ymd(endOf(parse(k)));
const daysIn=k=>{const s=parse(k);return Math.round((endOf(s)-s)/DAY);};
const curKey=()=>keyOf(new Date());
const rangeText=(s,e)=>'من '+dm(s)+' إلى '+dm(e);

/* ---------- icons ---------- */
const svg=(p,s)=>'<svg viewBox="0 0 24 24" width="'+(s||22)+'" height="'+(s||22)+'" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';
const IC={
  calc:svg('<rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M8.5 7.5h7M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01"/>'),
  plus:svg('<path d="M12 5v14M5 12h14"/>'),
  trash:svg('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>',20),
  back:svg('<path d="M9 6l6 6-6 6"/>',20),
  pdf:svg('<path d="M12 4v11M7.5 11l4.5 4.5 4.5-4.5M5 20h14"/>',20),
  x:svg('<path d="M6 6l12 12M18 6L6 18"/>',20),
  edit:svg('<path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/>',20)
};

/* ---------- state ---------- */
const INCOME=3990;
const SEED=[['food','طعام',1200],['elec','كهرباء',200],['veg','خضروات',500],['cheese','جبنة',500],['clean','منظفات',500],['uber','أوبر',500],['reserve','احتياطي',590]];
const defaults=()=>({v:2,income:INCOME,firstKey:curKey(),cats:SEED.map((r,i)=>({id:r[0],name:r[1],pct:r[2]/INCOME*100,ci:i})),goals:[]});
const S={settings:defaults(),expenses:{},periods:{},conf:{s:false,e:false,p:false},ready:false,mode:'wait',hasDoc:false,
  tab:'home',catId:null,repKey:'cur',expFilter:'all',draft:{},sd:null,q:'',who:'all',rcpt:false,confirmDel:null,confirmCat:null,notice:'',canWrite:true,hh:null,uid:null,autoDone:false,seeding:false};

const limitOf=(c,inc)=>round2(inc*c.pct/100);
const safeImg=v=>/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(v||'')?v:'';
function goals(){return Array.isArray(S.settings.goals)?S.settings.goals:[];}
let instEv=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEv=e;if(S.tab==='settings')render(true);});
window.addEventListener('appinstalled',()=>{instEv=null;toast('تم تثبيت التطبيق على جهازك.');if(S.tab==='settings')render(true);});
const isStandalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}catch(e){return false;}};
const recurs=()=>Array.isArray(S.settings.recurring)?S.settings.recurring:[];
let recBusy=false;
async function runRecurring(){
  if(recBusy||!S.canWrite||!S.ready||!recurs().length)return;recBusy=true;
  try{const key=curKey(),n=structuredClone(S.settings);let ch=false;
    for(const r of n.recurring){
      if(r.last===key)continue;if(r.freq==='m'&&parse(key).getDate()!==20)continue;if(!n.cats.some(c=>c.id===r.cat))continue;
      const x={id:'r_'+r.id+'_'+key,amount:r.amount,cat:r.cat,note:r.name+' (متكرر)',date:key,period:key,ts:Date.now(),by:'تلقائي'};
      if(!S.expenses[x.id])await setExpense(x);
      r.last=key;ch=true;}
    if(ch){await up(T.s,'main',n);S.settings=n;if(S.sd)S.sd.recurring=structuredClone(n.recurring);render();toast('تمت إضافة المصروفات المتكررة لهذه المدة.');}
  }catch(e){}finally{recBusy=false;}
}
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}};
const meName=()=>(LS('bud_me')||'').trim();
function askMe(){const n=(prompt('اكتب اسمك ليُسجَّل على مصروفاتك (مثال: زياد)')||'').trim().slice(0,30);if(n)LS('bud_me',n);return n;}
function notify(title,body,tag){
  if(typeof Notification!=='undefined'&&Notification.permission==='granted'){try{new Notification(title,{body:body,tag:tag});return;}catch(e){}}
  toast(title+' — '+body,'warn');
}
function checkAlerts(){
  if(!S.ready||LS('bud_notif')!=='1')return;
  const key=curKey();let sent={};try{sent=JSON.parse(LS('bud_sent')||'{}')||{};}catch(e){}
  if(sent.p!==key)sent={p:key};
  let dirty=false;
  view(key).cats.forEach(c=>{if(c.id==='_x'||!(c.limit>0))return;const r=c.spent/c.limit,lv=r>=1?100:r>=0.8?80:0;
    if(lv&&(sent[c.id]||0)<lv){sent[c.id]=lv;dirty=true;notify(lv===100?'تجاوزت حد '+c.name:'اقتربت من حد '+c.name,lv===100?'صرفت '+fmt(c.spent)+' من '+fmt(c.limit)+' ج.م':'استهلكت '+Math.round(r*100)+'% من الحد','c'+c.id+lv);}});
  const today=ymd(new Date()),hm=(LS('bud_rem')||'20:00').split(':').map(Number),n=new Date();
  if(sent.r!==today&&n.getHours()*60+n.getMinutes()>=hm[0]*60+(hm[1]||0)&&!Object.values(S.expenses).some(x=>x.date===today)){sent.r=today;dirty=true;notify('تذكير بتسجيل المصروفات','لم يُسجَّل أي مصروف اليوم. سجّل مصروفاتك قبل أن تنساها.','rem');}
  if(dirty)LS('bud_sent',JSON.stringify(sent));
}
const pendingSave=()=>Math.max(0,round2(savingsInfo().total-(S.settings.allocated||0)));
function openAlloc(){
  const p=pendingSave(),gs=goals().filter(g=>(g.saved||0)<g.target);
  if(!gs.length){toast('لا توجد أهداف غير مكتملة لتوزيع المدخرات عليها.');return;}
  S.alP=p;
  $('#dlgRoot').innerHTML='<div class="scrim" data-act="close-add"></div><div class="dlg" role="dialog" aria-modal="true" aria-label="توزيع المدخرات">'
    +'<div class="dlg-h"><h2>وزّع مدخراتك على الأهداف</h2><button type="button" class="icon-btn plain" data-act="close-add" aria-label="إغلاق">'+IC.x+'</button></div>'
    +'<p class="cat-s">المتاح للتوزيع من المدد المغلقة: <b>'+fmt(p)+' ج.م</b> <span id="alLeft"></span></p>'
    +gs.map(g=>'<div class="field"><label>'+esc(g.name)+' <small class="cat-s">(متبقي '+fmt(g.target-(g.saved||0))+' ج.م)</small></label><input class="in" inputmode="decimal" data-in="al" data-id="'+esc(g.id)+'" placeholder="0"></div>').join('')
    +'<div class="btn-row"><button class="btn" data-act="alloc-auto">توزيع تلقائي</button><button class="btn primary" data-act="alloc-save">تأكيد التوزيع</button></div></div>';
  updAl();
}
function updAl(){const p=S.alP||0;let t=0;$$('[data-in="al"]').forEach(i=>{const v=toNum(i.value);if(!isNaN(v))t+=v;});const l=$('#alLeft');if(l){const r=round2(p-t);l.textContent=r>=0?'· المتبقي بدون توزيع '+fmt(r)+' ج.م':'· زيادة '+fmt(-r)+' ج.م عن المتاح';l.style.color=r<0?'var(--bad)':'';}}
let basket=[];
const basketTotal=()=>round2(basket.reduce((a,r)=>{const v=toNum(r.p);return a+(isNaN(v)?0:v);},0));
function updBasket(){const t=$('#bTot');if(t)t.textContent=fmt(basketTotal())+' ج.م';}
function drawBasket(foc){
  $('#calcRoot').innerHTML='<div class="scrim hi" data-act="close-calc"></div><div class="dlg hi" role="dialog" aria-modal="true" aria-label="سلة المشتريات">'
    +'<div class="dlg-h"><h2>سلة المشتريات</h2><button class="icon-btn plain" data-act="close-calc" aria-label="إغلاق">'+IC.x+'</button></div>'
    +basket.map((r,i)=>'<div class="b-row"><input class="in" data-in="b-n" data-i="'+i+'" placeholder="البند" value="'+esc(r.n)+'"><input class="in" data-in="b-p" data-i="'+i+'" inputmode="decimal" placeholder="السعر" value="'+esc(r.p)+'"><button class="icon-btn plain" data-act="b-del" data-id="'+i+'" aria-label="حذف البند">'+IC.x+'</button></div>').join('')
    +'<button class="btn sm" data-act="b-add">'+IC.plus+' بند</button><div class="b-tot"><span>الإجمالي</span><span id="bTot"></span></div>'
    +'<button class="btn primary" data-act="b-use">استخدم الإجمالي كمبلغ</button></div>';
  updBasket();if(foc){const f=$$('[data-in="b-n"]'),l=f[f.length-1];if(l)l.focus();}
}
function whoStats(items){const m={};items.forEach(x=>{if(x.by==='تلقائي')return;const k=x.by||'غير محدد';m[k]=(m[k]||0)+(+x.amount||0);});return Object.entries(m).sort((a,b)=>b[1]-a[1]);}
/* مسودة الإعدادات: كل التعديلات تتم عليها ولا تُطبَّق إلا بزر الحفظ */
function sdraft(){if(!S.sd)S.sd=structuredClone(S.settings);return S.sd;}
const sdDirty=()=>!!S.sd&&JSON.stringify(S.sd)!==JSON.stringify(S.settings);
window.addEventListener('beforeunload',e=>{if(sdDirty()){e.preventDefault();e.returnValue='';}});

const RECOV=/type=recovery/.test(location.hash);
const sb=window.supabase.createClient('https://aaqjspyyycxqfxpjmrwq.supabase.co','sb_publishable_jJgCxB6NugmMHa9C6Q04ug_OZmldH_8');
const T={s:'budget_settings',e:'budget_expenses',p:'budget_periods',sh:'budget_shopping'};
async function up(t,id,data){if(!S.hh)throw new Error('no household');const r=await sb.from(t).upsert({household_id:S.hh.id,id:id,data:data},{onConflict:'household_id,id'});if(r.error)throw r.error;}
async function del(t,id){if(!S.hh)throw new Error('no household');const r=await sb.from(t).delete().eq('household_id',S.hh.id).eq('id',id);if(r.error)throw r.error;}
async function guarded(fn){try{await fn();}catch(e){toast('تعذر الحفظ: '+((e&&e.message)||'خطأ غير معروف'),'bad');}}
async function setSettings(next){const previous=S.settings;try{await up(T.s,'main',next);S.settings=next;render();return true;}catch(e){S.settings=previous;toast('تعذر حفظ الإعدادات؛ لم يتم تطبيق التغييرات. '+((e&&e.message)||''),'bad');return false;}}
async function setExpense(e){setTimeout(checkAlerts,500);const old=S.expenses[e.id];S.expenses[e.id]=e;try{await up(T.e,e.id,e);}catch(err){if(old)S.expenses[e.id]=old;else delete S.expenses[e.id];throw err;}}
async function removeExpense(id){const old=S.expenses[id];delete S.expenses[id];try{await del(T.e,id);}catch(err){if(old)S.expenses[id]=old;throw err;}}
async function setPeriod(p){await up(T.p,p.key,p);S.periods[p.key]=p;}

/* ---------- حسابات المدة ---------- */
/* توزيع العجز: ما يتجاوزه أي قسم عن حده يُخصم من حدود باقي الأقسام بنسبة حدودها */
function spread(cats){
  cats.forEach(c=>{c.base=c.limit;c.cut=0;});
  const pool=cats.filter(c=>c.id!=='_x'&&c.base>0),over=new Set();
  for(let g=0;g<12;g++){
    pool.forEach(c=>{if(c.spent>c.limit+0.001)over.add(c.id);});
    let O=0;pool.forEach(c=>{if(over.has(c.id)){c.limit=c.base;c.cut=0;O+=Math.max(0,c.spent-c.base);}});
    const rest=pool.filter(c=>!over.has(c.id)),tb=rest.reduce((s,c)=>s+c.base,0);
    rest.forEach(c=>{const cut=tb>0?Math.min(c.base,O*c.base/tb):0;c.cut=round2(cut);c.limit=round2(c.base-cut);});
    if(!rest.some(c=>c.spent>c.limit+0.001))break;
  }
}
function view(key){
  const s=parse(key),e=endOf(s),days=daysIn(key),rec=S.periods[key];
  const items=Object.values(S.expenses).filter(x=>x.period===key).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.ts||0)-(a.ts||0));
  const income=rec?rec.income:S.settings.income;
  const base=rec?rec.rows:S.settings.cats.map(c=>({id:c.id,name:c.name,pct:c.pct,ci:c.ci,limit:limitOf(c,income)}));
  const cats=base.map(r=>{const its=items.filter(x=>x.cat===r.id);return Object.assign({},r,{items:its,count:its.length,spent:rec?r.spent:round2(sum(its))});});
  if(!rec){const known=new Set(cats.map(c=>c.id));const lost=items.filter(x=>!known.has(x.cat));
    if(lost.length)cats.push({id:'_x',name:'قسم محذوف',pct:0,ci:7,limit:0,items:lost,count:lost.length,spent:round2(sum(lost))});}
  if(!rec)spread(cats);
  const totalSpent=round2(cats.reduce((a,c)=>a+c.spent,0));
  return {key,start:s,end:e,days,income,cats,items,totalSpent,closed:!!rec,rec,left:round2(income-totalSpent)};
}
function timing(v){
  const n=new Date(),today=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  let el=Math.round((today-v.start)/DAY)+1;el=Math.min(Math.max(el,1),v.days);
  return {elapsed:el,left:v.days-el+1,f:el/v.days};
}
function scoreOf(v,final){
  const cs=v.cats.filter(c=>c.id!=='_x'&&c.limit>0);
  const within=cs.filter(c=>c.spent<=c.limit).length,over=cs.length-within;
  const saved=Math.max(0,round2(v.income-v.totalSpent));
  const base=within*10-over*5,savePts=final?Math.floor(saved/10):0,bonus=(over===0&&cs.length&&v.totalSpent>0)?20:0;
  return {within,over,saved,base,savePts,bonus,pts:base+savePts+bonus};
}
async function closePeriod(key){
  const v=view(key),sc=scoreOf(v,true);
  await setPeriod({key,start:ymd(v.start),end:ymd(v.end),income:v.income,totalSpent:v.totalSpent,saved:sc.saved,points:sc.pts,within:sc.within,over:sc.over,bonus:sc.bonus,savePts:sc.savePts,
    rows:v.cats.filter(c=>c.id!=='_x').map(c=>({id:c.id,name:c.name,pct:c.pct,ci:c.ci,limit:c.limit,base:c.base,cut:c.cut,spent:c.spent,count:c.count})),closedAt:Date.now()});
}
async function autoClose(){
  if(!S.canWrite)return;
  const cur=curKey();let k=S.settings.firstKey||cur,g=0,closedN=0;
  while(k<cur&&g++<120){
    if(!S.periods[k]&&Object.values(S.expenses).some(e=>e.period===k)){try{await closePeriod(k);closedN++;}catch(err){S.notice='تعذر إغلاق المدة السابقة بسبب مشكلة في الحفظ. تحقق من الاتصال ثم أعد فتح البرنامج.';break;}}
    k=nextKey(k);
  }
  render();
  if(closedN&&goals().length&&pendingSave()>=1)openAlloc();
}
const closedList=()=>Object.values(S.periods).sort((a,b)=>a.key<b.key?1:-1);
const savingsInfo=()=>{const rows=closedList().filter(p=>p.saved>0);return {total:round2(rows.reduce((s,p)=>s+p.saved,0)),rows};};
const pointsTotal=()=>Object.values(S.periods).reduce((s,p)=>s+(p.points||0),0);
const LEVELS=[[0,'مبتدئ'],[100,'مُدبّر'],[300,'خبير'],[600,'أستاذ تدبير']];
const levelOf=p=>LEVELS.filter(l=>p>=l[0]).pop()[1];
function catInfo(id){
  const c=S.settings.cats.find(x=>x.id===id);if(c)return {name:c.name,ci:c.ci};
  for(const p of closedList()){const r=p.rows.find(x=>x.id===id);if(r)return {name:r.name,ci:r.ci};}
  return {name:'قسم محذوف',ci:7};
}

/* ---------- التنبيهات الذكية ---------- */
function insights(v,t){
  const out=[];
  v.cats.filter(c=>c.id!=='_x'&&c.limit>0).forEach(c=>{
    const p=c.spent/c.limit,perDay=t.left>0?Math.max(0,c.limit-c.spent)/t.left:0;
    if(p>1)out.push({sev:'bad',title:'تخطيت حد '+c.name,text:'صرفت '+fmt(c.spent)+' والحد '+fmt(c.limit)+' (زيادة '+fmt(c.spent-c.limit)+' ج.م). تم توزيعها على باقي الأقسام فنقصت حدودها.'});
    else if(p>=0.8)out.push({sev:'warn',title:c.name+' وصل '+Math.round(p*100)+'% من حده',text:'المتبقي '+fmt(c.limit-c.spent)+' ج.م لباقي المدة، أي '+fmt(perDay)+' ج.م يوميًا.'});
  });
  const ov=round2(v.cats.reduce((s,c)=>c.base>0?s+Math.max(0,c.spent-c.base):s,0));
  if(ov>0)out.push({sev:'info',title:'تم توزيع عجز '+fmt(ov)+' ج.م على باقي الأقسام',text:'خُصم العجز من حدود الأقسام الأخرى بنسبة حد كل قسم، وتجد المبلغ المخصوم داخل بطاقة كل قسم.'});
  if(t.elapsed>=3&&v.income&&v.totalSpent/v.income>t.f+0.15)
    out.push({sev:'warn',title:'الصرف الإجمالي أسرع من الوقت',text:'مرّ '+Math.round(t.f*100)+'% من المدة وصرفت '+Math.round(v.totalSpent/v.income*100)+'% من المرتب.'});
  if(!out.length){
    if(v.totalSpent===0)out.push({sev:'info',title:'لم تسجل مصروفات بعد',text:'سجّل مصروفاتك أولًا بأول لمتابعة حدود الأقسام.'});
    else out.push({sev:'good',title:'كل الأقسام داخل حدودها',text:'استمر في متابعة المصروفات والالتزام بالميزانية المحددة.'});
  }
  if(v.totalSpent>0){const top=v.cats.slice().sort((a,b)=>b.spent-a.spent)[0];
    out.push({sev:'info',title:'أكبر قسم صرفًا: '+top.name,text:Math.round(top.spent/v.totalSpent*100)+'% من إجمالي المصروف ('+fmt(top.spent)+' ج.م).'});}
  const ord={bad:0,warn:1,good:2,info:3};
  return out.sort((a,b)=>ord[a.sev]-ord[b.sev]).slice(0,6);
}
const KW={'طعام':['لحمة','لحم','فراخ','دجاج','سمك','رز','أرز','مكرونة','سكر','زيت','عيش','سوبر ماركت','بقالة','فطار','غداء','عشاء'],
  'كهرباء':['كهربا','فاتورة النور','نور','عداد'],'خضروات':['خضار','طماطم','بطاطس','خيار','فاكهة','فواكه','بصل','ثوم','سوق'],
  'جبنة':['جبن','لبن','زبادي','قشطة','بيض','ألبان'],'منظفات':['صابون','منظف','كلور','مسحوق','سائل','شامبو','اسفنج','إسفنج'],
  'أوبر':['uber','اوبر','تاكسي','مواصلات','توصيل','إنديرايف','انديرايف']};
function suggestCat(note){
  const n=String(note).toLowerCase();if(!n.trim())return null;
  for(const c of S.settings.cats){const toks=[c.name].concat(KW[c.name]||[]);if(toks.some(t=>t&&n.indexOf(t.toLowerCase())>-1))return c.id;}
  return null;
}

const PAL=['#2B6CB0','#C2571A','#4F8A1E','#A9780A','#7B4FA3','#16808B','#B03A5B','#5E6E74'];
function periodPaper(key,pdf){
  const v=view(key),isCur=key===curKey(),rec=v.rec;
  const sc=rec?{pts:rec.points,saved:rec.saved,within:rec.within,over:rec.over,bonus:rec.bonus,savePts:rec.savePts}:scoreOf(v,false);
  const rows=v.cats.map(c=>{const d=round2(c.limit-c.spent),w=c.limit>0?Math.min(100,c.spent/c.limit*100):(c.spent>0?100:0),col=c.spent>c.limit?'#B0322A':PAL[c.ci%8];
    return '<tr data-brk><td><div class="p-name"><i style="background:'+PAL[c.ci%8]+'"></i>'+esc(c.name)+'</div><div class="p-bar"><u style="width:'+w+'%;background:'+col+'"></u></div></td><td>'+fmt(c.limit)+(c.cut>0?'<div class="p-leg">بعد خصم '+fmt(c.cut)+' لتغطية عجز</div>':'')+'</td><td>'+fmt(c.spent)+'</td><td class="'+(d<0?'neg':'pos')+'">'+(d<0?'تجاوز '+fmt(-d):'وفر '+fmt(d))+'</td></tr>';}).join('');
  const over=v.cats.filter(c=>c.limit>0&&c.spent>c.limit);
  let sav;
  if(v.closed)sav=sc.saved>0?'<p><b>المدخرات:</b> أُضيف مبلغ '+fmt(sc.saved)+' ج.م إلى المدخرات وتم إنشاء قسم المدخرات لهذه المدة.</p>':'<p><b>المدخرات:</b> لم يتحقق توفير في هذه المدة، لذلك لم يُنشأ قسم المدخرات.</p>';
  else sav='<p><b>المتبقي حتى الآن:</b> '+fmt(Math.max(0,v.left))+' ج.م. عند انتهاء المدة في '+dm(v.end)+' يُرحَّل الموفر إلى المدخرات.</p>';
  const pts=v.closed?'<p><b>النقاط:</b> '+sc.within+' قسم داخل الحد (+'+sc.within*10+')'+(sc.over?'، '+sc.over+' قسم تجاوز الحد (−'+sc.over*5+')':'')+'، التوفير (+'+sc.savePts+')'+(sc.bonus?'، مكافأة عدم التجاوز (+'+sc.bonus+')':'')+' = <b>'+sc.pts+'</b> نقطة.</p>'
    :'<p><b>النقاط حتى الآن:</b> '+sc.pts+' (من الالتزام بحدود الأقسام). تُضاف نقاط التوفير عند إقفال المدة.</p>';
  const warn=over.length?'<p><b>أقسام تجاوزت حدها:</b> '+over.map(c=>esc(c.name)+' ('+fmt(c.spent-c.limit)+' ج.م)').join('، ')+'.</p>':'<p><b>الالتزام:</b> لا يوجد قسم تجاوز حده.</p>';
  return '<article class="paper'+(pdf?' pdfw':'')+'"><div class="p-head"><div><h2>تقرير مدة المصروف</h2><p>'+rangeText(v.start,v.end)+' · '+v.days+' يومًا</p></div><span class="p-badge'+(isCur&&!v.closed?' open':'')+'">'+(v.closed?'مدة مغلقة':'مدة جارية')+'</span></div>'
    +'<div class="p-sum"><div><span>الميزانية</span><b>'+fmt(v.income)+'</b></div><div><span>إجمالي المصروف</span><b>'+fmt(v.totalSpent)+'</b></div><div><span>'+(v.closed?'المدخر':'المتبقي')+'</span><b>'+fmt(v.closed?sc.saved:Math.max(0,v.left))+'</b></div><div><span>عدد العمليات</span><b>'+v.items.length+'</b></div></div><div class="p-kv"><div><span>متوسط الصرف اليومي</span><b>'+fmt((v.closed?v.days:timing(v).elapsed)?v.totalSpent/(v.closed?v.days:timing(v).elapsed):0)+' ج.م</b></div><div><span>نسبة استهلاك الميزانية</span><b>'+Math.round(v.income?v.totalSpent/v.income*100:0)+'%</b></div></div>'
    +'<div class="p-wrap"><table class="p-table"><thead><tr><th>القسم</th><th>الحد</th><th>المصروف</th><th>الفرق</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
    +'<div class="p-block" data-brk>'+sav+pts+warn+'</div>'
    +'<p class="p-note">أُنشئ هذا التقرير بتاريخ '+fmtDate(ymd(new Date()))+'. المبالغ بالجنيه المصري.</p></article>';

function catPaper(id,pdf){
  const v=view(curKey()),c=v.cats.find(x=>x.id===id);
  if(!c)return '<div class="empty">هذا القسم غير موجود.</div>';
  const t=timing(v),used=c.limit>0?c.spent/c.limit:0,allow=c.limit/v.days,left=round2(c.limit-c.spent),col=PAL[c.ci%8];
  const dd=[];for(let i=0;i<v.days;i++){const d=new Date(v.start.getFullYear(),v.start.getMonth(),v.start.getDate()+i);dd.push({d:ymd(d),n:d.getDate(),sum:round2(sum(c.items.filter(x=>x.date===ymd(d))))});}
  const max=Math.max(allow*1.3,Math.max.apply(null,dd.map(x=>x.sum)),1);
  const plot='<div class="p-plot"><div class="p-line" style="bottom:'+(allow/max*100)+'%"></div>'+dd.map(x=>'<div class="col"><u style="height:'+(x.sum/max*100)+'%;background:'+(x.sum>allow?'#B0322A':col)+'"></u></div>').join('')+'</div><div class="p-days">'+dd.map(x=>'<span>'+x.n+'</span>').join('')+'</div>'
    +'<p class="p-leg">الخط المتقطع هو المسموح يوميًا ('+fmt(allow)+' ج.م). الأعمدة الحمراء تجاوزته.</p>';
  const amts=c.items.map(x=>+x.amount),avgOp=amts.length?sum(c.items)/amts.length:0,maxOp=amts.length?Math.max.apply(null,amts):0;
  const kv=[['الحد',fmt(c.limit)+' ج.م'],['المصروف',fmt(c.spent)+' ج.م'],[left>=0?'المتبقي':'الزيادة',fmt(Math.abs(left))+' ج.م'],['نسبة الاستهلاك',Math.round(used*100)+'%'],['عدد العمليات',c.count],['متوسط العملية',fmt(avgOp)+' ج.م'],['أكبر عملية',fmt(maxOp)+' ج.م']]

/* ---------- PDF ---------- */
async function exportPdf(html,name){
  if(!window.html2canvas||!window.jspdf){toast('تعذر تحميل مكتبة PDF. تحقق من الاتصال وحاول مرة أخرى.','bad');return;}
  toast('جارٍ تجهيز ملف PDF…');
  const stage=$('#pdfStage');stage.innerHTML=html;
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const el=stage.firstElementChild,SC=2,er=el.getBoundingClientRect();
    const brks=$$('[data-brk]',el).map(n=>Math.round((n.getBoundingClientRect().bottom-er.top)*SC)).sort((a,b)=>a-b);
    const canvas=await window.html2canvas(el,{scale:SC,backgroundColor:'#ffffff',useCORS:true,
      onclone:doc=>{const s=doc.getElementById('pdfStage');if(s){s.style.position='absolute';s.style.left='0';s.style.top='0';}}});
    const pdf=new window.jspdf.jsPDF({unit:'pt',format:'a4'}),pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),M=24;
    const ppp=canvas.width/pw,pageH=Math.floor((ph-2*M)*ppp),H=canvas.height,minChunk=Math.round(pageH*0.4);
    let y=0,first=true;
    while(y<H){
      let end=Math.min(H,y+pageH);
      if(end<H){const b=brks.filter(v=>v>y+minChunk&&v<=end).pop();if(b)end=b;}
      const h=end-y,pc=document.createElement('canvas');pc.width=canvas.width;pc.height=h;
      const ctx=pc.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,pc.width,h);ctx.drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);
      if(!first)pdf.addPage();first=false;
      pdf.addImage(pc.toDataURL('image/jpeg',0.92),'JPEG',0,M,pw,h/ppp);
      y=end;
    }
    saveBlob(name,pdf.output('blob'));
    toast('تم تجهيز الملف.');
  }catch(e){toast('تعذر إنشاء ملف PDF.','bad');}
  finally{stage.innerHTML='';}
}

let calc={expr:'',cb:null};
function evalExpr(s){
  const t=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-'),tk=t.match(/\d*\.?\d+|[+\-*/]/g);
  if(!tk)return NaN;let i=0;
  const num=()=>{let sg=1;while(tk[i]==='-'||tk[i]==='+'){if(tk[i]==='-')sg=-sg;i++;}return sg*parseFloat(tk[i++]);};
  const term=()=>{let v=num();while(tk[i]==='*'||tk[i]==='/'){const o=tk[i++],r=num();v=o==='*'?v*r:v/r;}return v;};
  const ex=()=>{let v=term();while(tk[i]==='+'||tk[i]==='-'){const o=tk[i++],r=term();v=o==='+'?v+r:v-r;}return v;};
  const v=ex();return i===tk.length&&isFinite(v)?v:NaN;
}
function openCalc(cb,label){
  calc={expr:'',cb:cb,label:label};
  const K=['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','='];
  $('#calcRoot').innerHTML='<div class="scrim hi" data-act="close-calc"></div><div class="dlg hi" role="dialog" aria-modal="true" aria-label="الآلة الحاسبة">'
    +'<div class="dlg-h"><h2>الآلة الحاسبة</h2><button class="icon-btn plain" data-act="close-calc" aria-label="إغلاق">'+IC.x+'</button></div>'
    +'<div class="calc-disp" aria-live="polite"><div class="ex" id="cEx"></div><div class="rs" id="cRs">0</div></div>'
    +'<div class="keys">'+K.map(k=>{const cls='key'+('÷×−+'.includes(k)?' op':'')+(k==='='?' eq':'');return '<button class="'+cls+'" data-k="'+k+'" style="'+(k==='='?'grid-column:span 2':'')+'" aria-label="'+({'⌫':'مسح','C':'تفريغ','=':'يساوي'}[k]||k)+'">'+k+'</button>';}).join('')+'</div>'
    +'<button class="btn primary" id="cUse" data-act="calc-use">'+esc(label||'استخدم الناتج')+'</button></div>';
  updateCalc();
}
function updateCalc(){
  const ex=$('#cEx'),rs=$('#cRs'),use=$('#cUse');if(!ex)return;
  const v=evalExpr(calc.expr);ex.textContent=calc.expr;
  rs.textContent=isNaN(v)?(calc.expr?'…':'0'):fmt(v);
  if(use)use.disabled=!(v>0);
}
function calcKey(k){
  const ops='+−×÷';
  if(k==='C')calc.expr='';
  else if(k==='⌫')calc.expr=calc.expr.slice(0,-1);
  else if(k==='='){const v=evalExpr(calc.expr);if(!isNaN(v))calc.expr=String(round2(v));}
  else if(k==='%'){const m=calc.expr.match(/(\d*\.?\d+)$/);if(m)calc.expr=calc.expr.slice(0,-m[1].length)+String(parseFloat(m[1])/100);}
  else if(ops.indexOf(k)>-1){if(!calc.expr){if(k==='−')calc.expr='−';}else if(ops.indexOf(calc.expr.slice(-1))>-1&&calc.expr.length>1)calc.expr=calc.expr.slice(0,-1)+k;else if(ops.indexOf(calc.expr.slice(-1))===-1)calc.expr+=k;}
  else if(k==='.'){const last=calc.expr.split(/[+−×÷]/).pop();if(last.indexOf('.')===-1)calc.expr+=last===''?'0.':'.';}
  else calc.expr+=k;
  updateCalc();
}

async function shopAdd(){
  const d=S.shd||{},name=(d.name||'').trim();
  if(!name){toast('اكتب اسم العنصر.','warn');return;}
  let est=0;if((d.est||'').trim()){est=toNum(d.est);if(!(est>0)){toast('السعر التقديري غير صحيح.','warn');return;}}
  const by=meName()||askMe(),x={id:rid(),name:name.slice(0,80),qty:(d.qty||'').trim().slice(0,30),note:(d.note||'').trim().slice(0,120),est:round2(est),status:'pending',by:by,ts:Date.now()};
  S.shop=S.shop||{};S.shop[x.id]=x;S.shopSeen&&S.shopSeen.add(x.id);
  try{await up(T.sh,x.id,x);}catch(err){delete S.shop[x.id];toast('تعذر إضافة الطلب: '+((err&&err.message)||''),'bad');render(true);return;}
  S.shd={};render(true);toast('تمت إضافة الطلب للقائمة.');
}
async function shopDel(id){
  if(S.confirmShop!==id){S.confirmShop=id;render(true);setTimeout(()=>{if(S.confirmShop===id){S.confirmShop=null;render();}},4000);return;}
  S.confirmShop=null;const old=S.shop[id];delete S.shop[id];
  try{await del(T.sh,id);render(true);toast('تم الحذف.');}catch(err){S.shop[id]=old;render(true);toast('تعذر الحذف.','bad');}
}
let rtCh=null,rtT=null;
function setupRealtime(){
  if(rtCh||!S.hh)return;
  const kick=()=>{clearTimeout(rtT);rtT=setTimeout(()=>loadAll(),350);};
  try{
    rtCh=sb.channel('hh-'+S.hh.id);
    ['budget_shopping','budget_expenses','budget_periods'].forEach(t=>{rtCh.on('postgres_changes',{event:'*',schema:'public',table:t},kick);});
    rtCh.subscribe(st=>{S.rt=st;if(S.tab==='shop')render();});
  }catch(e){}
}

document.addEventListener('input',e=>{
  const el=e.target,k=el.dataset&&el.dataset.in;if(!k)return;
  if(k==='al'){updAl();return;}
  if(k.indexOf('sh-')===0){S.shd=S.shd||{};S.shd[k.slice(3)]=el.value;return;}
  if(k==='b-n'||k==='b-p'){const bi=+el.dataset.i;if(basket[bi])basket[bi][k==='b-n'?'n':'p']=el.value;updBasket();return;}
  if(k==='exp-q'){S.q=el.value;const b=$('#expList');if(b)b.innerHTML=expBody();return;}
  if(S.tab!=='settings')return;
  const sd=sdraft(),row=el.closest('.srow'),c=row&&sd.cats.find(x=>x.id===row.dataset.id),v=toNum(el.value);
  if(k==='income'){if(v>0)sd.income=v;}
  else if(k==='cat-name'&&c){if(el.value.trim())c.name=el.value.trim();}
  else if(k==='cat-pct'&&c){c.pct=isNaN(v)?0:Math.min(100,v);}
  else if(k==='cat-amt'&&c){c.pct=isNaN(v)||!(sd.income>0)?0:Math.min(100,v*100/sd.income);}
  else return;
  updateSettingsLive();
});
document.addEventListener('change',async e=>{
  if(e.target&&e.target.id==='backupFile'){const file=e.target.files&&e.target.files[0];e.target.value='';if(!file)return;try{const data=JSON.parse(await file.text());if(!data||!data.settings||!Array.isArray(data.expenses)||!Array.isArray(data.periods))throw new Error('invalid');if(!confirm('سيتم تحديث الإعدادات ودمج سجلات المصروفات والمدد من النسخة. لن تُحذف السجلات القديمة غير الموجودة فيها. هل تريد المتابعة؟'))return;const st=data.settings;if(!Array.isArray(st.cats)||!st.cats.length||!(+st.income>0)||st.cats.some(c=>!c||!c.id||!String(c.name||'').trim()||!Number.isFinite(+c.pct)||+c.pct<0))throw new Error('settings');const pct=st.cats.reduce((a,c)=>a+(+c.pct||0),0);if(Math.abs(pct-100)>.1)throw new Error('distribution');if(data.expenses.some(x=>!x||!x.id||!(+x.amount>0)||!/^\d{4}-\d{2}-\d{2}$/.test(x.date||'')))throw new Error('expense');if(data.periods.some(p=>!p||!p.key||!Array.isArray(p.rows)))throw new Error('period');await up(T.s,'main',st);for(const x of data.expenses)await up(T.e,x.id,x);for(const p of data.periods)await up(T.p,p.key,p);S.settings=st;await loadAll();toast('تم استيراد النسخة الاحتياطية.');}catch(err){toast('تعذرت الاستعادة: تحقق من سلامة ملف JSON والاتصال.','bad');}return;}
  const el=e.target,k=el.dataset&&el.dataset.in;if(!k)return;
  if(k==='rep-sel'){S.repKey=el.value;render(true);return;}
  if(k==='me-name'){const v=el.value.trim().slice(0,30);LS('bud_me',v);if(S.prof){S.prof.name=v;paintAv();sb.auth.updateUser({data:{full_name:v,avatar:S.prof.avatar||''}}).catch(()=>{});}toast('تم حفظ الاسم.');return;}
  if(k==='rem-time'){LS('bud_rem',el.value||'20:00');LS('bud_sent','{}');toast('تم حفظ وقت التذكير.');return;}
  if(S.tab!=='settings')return;
  const sd=sdraft();
  if(k==='income'){if(!(toNum(el.value)>0))toast('اكتب مرتبًا صحيحًا.','warn');el.value=sd.income;}
  else{const row=el.closest('.srow'),c=row&&sd.cats.find(x=>x.id===row.dataset.id);if(!c)return;
    if(k==='cat-name')el.value=c.name;
    else if(k==='cat-pct')el.value=round2(c.pct);
    else if(k==='cat-amt')el.value=round2(sd.income*c.pct/100);}
  updateSettingsLive();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#calcRoot').firstChild)closeCalc();else closeAdd();}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.ready){S.autoDone=false;loadAll();}});

/* ---------- البيانات ---------- */
function afterData(){
  const all=S.conf.s&&S.conf.e&&S.conf.p;
  if(all&&!S.ready){S.ready=true;S.notice='';}
  if(all&&S.mode==='db'&&!S.hasDoc&&!S.seeding){S.seeding=true;setSettings(S.settings).then(()=>{S.hasDoc=true;});}
  if(all&&!S.autoDone){S.autoDone=true;autoClose();}
  render();
  if(all)runRecurring();
  if(all&&S.ready&&location.hash==='#add'&&!S.hashDone){S.hashDone=1;try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}openAdd();}
  checkAlerts();
  if($('#view')&&S.tab==='settings')updateSettingsLive();
}
let loading=false,started=false,reloadAgain=false;
async function loadAll(){
  if(!S.hh)return;if(loading){reloadAgain=true;return;}loading=true;
  try{
    try{await loadHH();}catch(e){}
    const r=await Promise.all([T.s,T.e,T.p,T.sh].map(t=>sb.from(t).select('id,data').eq('household_id',S.hh.id)));
    const bad=r.slice(0,3).find(x=>x.error);
    if(bad){const m=(bad.error.message||'')+' '+(bad.error.code||'');S.notice=/does not exist|schema cache|42P01|PGRST205/.test(m)?'الجداول غير موجودة في Supabase. نفّذي ملف SQL المرفق أولًا.':'تعذر قراءة البيانات: '+m;render();return;}
    const st=r[0].data.find(x=>x.id==='main');
    if(st){S.settings=st.data;S.hasDoc=true;}
    S.expenses={};r[1].data.forEach(x=>{S.expenses[x.id]=x.data;});
    S.periods={};r[2].data.forEach(x=>{S.periods[x.id]=x.data;});
    S.shopErr=!!r[3].error;S.shop={};if(!r[3].error)r[3].data.forEach(x=>{S.shop[x.id]=x.data;});notifyShop();
    S.mode='db';S.conf={s:true,e:true,p:true};S.notice='';
    afterData();
  }catch(e){S.notice='تعذر الاتصال بـ Supabase.';render();}
  finally{loading=false;if(reloadAgain){reloadAgain=false;setTimeout(loadAll,50);}}
}
async function start(){
  await loadAll();setupRealtime();
  if(!started){started=true;setInterval(()=>{if(!document.hidden&&!$('#dlgRoot').firstChild&&!$('#calcRoot').firstChild)loadAll();},45000);}
}
let lMode='in',hhMode='new';
const GEN=[['food','طعام',35],['bills','فواتير',20],['transport','مواصلات',10],['health','صحة',8],['fun','ترفيه',7],['home','المنزل',5],['save','ادخار',15]];
function setLMode(m){lMode=m;
  const t={in:['سجّل الدخول للوصول إلى ميزانيتك.','دخول','ليس لديك حساب؟ أنشئ حسابًا'],up:['أنشئ حسابًا خاصًا بك. بياناتك لا يراها غيرك أنت وشريكك.','إنشاء الحساب','لديك حساب؟ سجّل الدخول'],'reset-req':['اكتب بريدك وسنرسل لك رابط استعادة كلمة المرور.','إرسال الرابط','العودة لتسجيل الدخول'],'reset-new':['اكتب كلمة مرور جديدة.','حفظ كلمة المرور','']}[m];
  $('#lSub').textContent=t[0];$('#lGo').textContent=t[1];$('#lSwitch').textContent=t[2];$('#lSwitch').hidden=!t[2];
  $('#gName').hidden=m!=='up';$('#gEmail').hidden=m==='reset-new';$('#gPass').hidden=m==='reset-req';$('#gPass2').hidden=!(m==='up'||m==='reset-new');$('#lForgot').hidden=m!=='in';
  $('#lPass').autocomplete=m==='in'?'current-password':'new-password';$('#loginMsg').textContent='';
}
function showLogin(msg){$('#login').hidden=false;$('#hhForm').hidden=true;$('#loginForm').hidden=false;if(lMode!=='reset-new')setLMode('in');$('#loginMsg').style.color='var(--bad)';$('#loginMsg').textContent=msg||'';}
function paintAv(){const b=$('#avBtn');if(!b)return;const p=S.prof||{};b.textContent=p.avatar||((p.name||p.email||'').trim().charAt(0).toUpperCase())||'👤';}
function openProfile(){
  const p=S.prof||{},h=S.hh;if(!S.prof)return;delete p.avD;
  $('#dlgRoot').innerHTML='<div class="scrim" data-act="close-add"></div><div class="dlg" role="dialog" aria-modal="true" aria-label="الملف الشخصي">'
    +'<div class="dlg-h"><h2>الملف الشخصي</h2><button type="button" class="icon-btn plain" data-act="close-add" aria-label="إغلاق">'+IC.x+'</button></div>'
    +'<div class="chips wrap" id="avPick">'+['🙂','👨','👩','🧑','👧','👦','🌟','🏠'].map(e=>'<button type="button" class="chip" data-act="av-pick" data-id="'+e+'" aria-pressed="'+(p.avatar===e)+'">'+e+'</button>').join('')+'<button type="button" class="chip" data-act="av-pick" data-id="" aria-pressed="'+(!p.avatar)+'">الحرف الأول</button></div>'
    +'<div class="field"><label for="pName">الاسم (يظهر على مصروفاتك)</label><input class="in" id="pName" maxlength="30" value="'+esc(p.name)+'" placeholder="مثال: زياد"></div>'
    +'<div class="field"><label for="pMail">البريد الإلكتروني</label><input class="in" id="pMail" dir="ltr" readonly value="'+esc(p.email)+'"></div>'
    +'<button class="btn primary" data-act="prof-save">حفظ الملف الشخصي</button>'
    +(h?'<p class="cat-s">البيت: '+esc(h.name)+' · '+(h.role==='owner'?'مالك':'عضو')+' · الأعضاء '+h.members+' من 2</p>':'')
    +'<div class="field"><label for="pPass">تغيير كلمة المرور</label><input class="in" id="pPass" type="password" dir="ltr" autocomplete="new-password" placeholder="كلمة مرور جديدة (6 خانات على الأقل، أرقام فقط تكفي)"><input class="in" id="pPass2" type="password" dir="ltr" autocomplete="new-password" placeholder="أعد كتابتها"></div>'
    +'<button class="btn" data-act="pass-save">تغيير كلمة المرور</button>'
    +'<button class="btn danger" data-act="logout">تسجيل الخروج</button></div>';
}
async function loadHH(){
  const u=await sb.auth.getUser();if(!u.data||!u.data.user)return false;S.uid=u.data.user.id;{const md=u.data.user.user_metadata||{};S.prof={name:md.full_name||'',avatar:md.avatar||'',email:u.data.user.email||''};if(S.prof.name&&!meName())LS('bud_me',S.prof.name);paintAv();}
  const r=await sb.from('household_members').select('household_id,role,households(name,invite_code)').eq('user_id',S.uid),m=await sb.from('household_members').select('user_id');
  if(r.error)throw r.error;const row=r.data&&r.data[0];if(!row)return false;
  const h=row.households||{};S.hh={id:row.household_id,role:row.role,name:h.name||'بيتي',code:h.invite_code||'',members:(m.data||[]).length||1};return true;
}
async function ensureHousehold(){
  try{if(await loadHH()){start();return;}}catch(e){S.notice='تعذر قراءة بيانات البيت ('+String((e&&e.message)||e).slice(0,120)+'). تأكد من تنفيذ ملف SQL في Supabase.';render();return;}
  $('#login').hidden=false;$('#loginForm').hidden=true;$('#hhForm').hidden=false;
}
async function afterAuth(){$('#login').hidden=true;await ensureHousehold();}
$('#lSwitch').addEventListener('click',()=>setLMode(lMode==='in'?'up':'in'));
$('#lForgot').addEventListener('click',()=>setLMode('reset-req'));
$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();const em=$('#lEmail').value.trim(),pw=$('#lPass').value,msg=$('#loginMsg'),go=$('#lGo'),ok=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em),here=location.href.split('#')[0];
  msg.style.color='var(--bad)';go.disabled=true;
  try{
    if(lMode==='in'){const r=await sb.auth.signInWithPassword({email:em,password:pw});if(r.error){msg.textContent='البريد أو كلمة المرور غير صحيحة.';return;}await afterAuth();}
    else if(lMode==='up'){
      if(!ok){msg.textContent='اكتب بريدًا صحيحًا.';return;}
      if(pw.length<6){msg.textContent='كلمة المرور لا تقل عن 6 خانات (يمكن أن تكون أرقامًا فقط).';return;}
      if(pw!==$('#lPass2').value){msg.textContent='كلمتا المرور غير متطابقتين.';return;}
      const r=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:here,data:{full_name:$('#lName').value.trim().slice(0,30)}}});
      if(r.error){msg.textContent='تعذر إنشاء الحساب. جرّب كلمة مرور أقوى أو بريدًا آخر.';return;}
      if(r.data&&r.data.session){await afterAuth();}
      else{setLMode('in');msg.style.color='var(--accent)';msg.textContent='تم إرسال رسالة تفعيل إلى بريدك. افتح الرابط ثم سجّل الدخول.';}
    }else if(lMode==='reset-req'){
      if(!ok){msg.textContent='اكتب بريدًا صحيحًا.';return;}
      await sb.auth.resetPasswordForEmail(em,{redirectTo:here});setLMode('in');msg.style.color='var(--accent)';msg.textContent='إذا كان البريد مسجّلًا ستصلك رسالة بالرابط.';
    }else{
      if(pw.length<6){msg.textContent='كلمة المرور لا تقل عن 6 خانات (يمكن أن تكون أرقامًا فقط).';return;}
      if(pw!==$('#lPass2').value){msg.textContent='كلمتا المرور غير متطابقتين.';return;}
      const r=await sb.auth.updateUser({password:pw});if(r.error){msg.textContent='تعذر تغيير كلمة المرور.';return;}
      try{history.replaceState(null,'',location.pathname+location.search);}catch(e2){}await afterAuth();
    }
  }catch(err){msg.textContent='حدث خطأ: '+String((err&&err.message)||err||'').slice(0,160);}
  finally{go.disabled=false;}
});
function setHHMode(m){hhMode=m;$('#hhNew').setAttribute('aria-pressed',m==='new');$('#hhJoin').setAttribute('aria-pressed',m==='join');$('#hhNewBox').hidden=m!=='new';$('#hhJoinBox').hidden=m!=='join';}
$('#hhNew').addEventListener('click',()=>setHHMode('new'));
$('#hhJoin').addEventListener('click',()=>setHHMode('join'));
$('#hhOut').addEventListener('click',()=>sb.auth.signOut().then(()=>location.reload()));
$('#hhForm').addEventListener('submit',async e=>{
  e.preventDefault();const msg=$('#hhMsg');msg.textContent='';
  try{
    if(hhMode==='new'){
      const inc=toNum($('#hhInc').value);if(!(inc>0)){msg.textContent='اكتب المرتب بأرقام صحيحة.';return;}
      const r=await sb.rpc('create_household',{p_name:$('#hhName').value});if(r.error)throw r.error;
      await loadHH();await up(T.s,'main',{v:2,income:round2(inc),firstKey:curKey(),cats:GEN.map((g,i)=>({id:g[0],name:g[1],pct:g[2],ci:i})),goals:[]});
    }else{
      const c=$('#hhCode').value.trim();if(!c){msg.textContent='اكتب كود الدعوة.';return;}
      const r=await sb.rpc('join_household',{p_code:c});if(r.error)throw r.error;await loadHH();
    }
    $('#login').hidden=true;start();
  }catch(err){const em0=String((err&&err.message)||err||'').slice(0,160);msg.textContent=/invalid code|household full/.test(em0)?'الكود غير صحيح أو البيت مكتمل.':'تعذر المتابعة: '+em0;}
});
sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')showLogin();});
async function init(){
  $('#calcBtn').innerHTML=IC.calc;$('#fab').innerHTML=IC.plus+' مصروف جديد';
  render(true);
  if(RECOV){$('#login').hidden=false;setLMode('reset-new');return;}
  const r=await sb.auth.getSession();
  if(!r.data||!r.data.session){showLogin();return;}
  await ensureHousehold();
}
setInterval(checkAlerts,60000);init();
})();
